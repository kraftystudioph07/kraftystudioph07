<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krafty Digital Card — Register</title>

    <link rel="stylesheet" href="css/Digital-business-card-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- Loader -->
    <div id="loaderOverlay">
      <div class="loader-content">
        <img src="images/KraftyMain.png" id="loaderLogo" alt="Loading Logo" />
        <div class="loader-spinner"></div>
      </div>
    </div>

    <!-- REGISTRATION PAGE -->
    <div class="registration" id="registrationDiv">
      <div class="Registration-header">
        <img src="images/KraftyMain.png" class="logo" alt="Cover Image" />
      </div>

      <h2>Register your Profile</h2>

      <div class="banner-upload-wrapper">
        <label for="regCover" class="banner-upload-label">
          <img
            id="regCoverPreview"
            src="images/KraftyMain.png"
            alt="Cover Image"
            style="width: 100%; border-radius: 10px"
          />
          <div class="banner-upload-overlay">
            <i class="fa-solid fa-camera"></i>
            <span>Tap to Upload Cover</span>
          </div>
        </label>
        <input type="file" id="regCover" accept="image/*" hidden />
      </div>

      <div class="photo-upload-wrapper">
        <label for="regPhoto" class="photo-upload-label">
          <img
            id="photoPreview"
            src="images/default-profile.png"
            alt="Profile Photo"
          />
          <div class="upload-overlay">
            <i class="fa-solid fa-camera"></i>
            <span>Tap to Upload</span>
          </div>
        </label>
        <input type="file" id="regPhoto" accept="image/*" hidden />
      </div>

      <small class="helper-text">Full Name</small>
      <div class="input-row">
        <i class="fa-solid fa-circle-user"></i>
        <input type="text" id="regName" placeholder="Full Name" required />
      </div>

      <small class="helper-text">Position</small>
      <div class="input-row">
        <i class="fa-solid fa-briefcase"></i>
        <input type="text" id="regPosition" placeholder="Position" />
      </div>

      <small class="helper-text">About Me</small>
      <div class="input-row textarea-row">
        <i class="fa-solid fa-user"></i>
        <textarea
          id="regAboutMe"
          placeholder="Tell people a little about yourself..."
          rows="4"
        ></textarea>
      </div>

      <small class="helper-text">Email</small>
      <div class="input-row">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="regEmail" placeholder="Email" required />
      </div>

      <small class="helper-text">Password</small>
      <div class="input-row password-row">
        <i class="fa-solid fa-lock"></i>
        <div class="password-wrapper">
          <input
            type="password"
            id="regPassword"
            placeholder="Password (required)"
          />
          <i id="togglePassword" class="fa-solid fa-eye toggle-icon"></i>
        </div>
      </div>

      <small class="helper-text">Phone</small>
      <div class="input-row">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="regPhone" placeholder="Phone" />
      </div>

      <small class="helper-text">Website</small>
      <div class="input-row">
        <i class="fa-solid fa-globe"></i>
        <input type="text" id="regWebsite" placeholder="Website" />
      </div>

      <small class="helper-text">Facebook</small>
      <div class="input-row">
        <i class="fa-brands fa-facebook-f"></i>
        <input type="text" id="regFacebook" placeholder="Facebook" />
      </div>

      <small class="helper-text">Instagram</small>
      <div class="input-row">
        <i class="fa-brands fa-instagram"></i>
        <input type="text" id="regInstagram" placeholder="Instagram" />
      </div>

      <small class="helper-text">TikTok</small>
      <div class="input-row">
        <i class="fa-brands fa-tiktok"></i>
        <input type="text" id="regTikTok" placeholder="TikTok" />
      </div>

      <small class="helper-text">LinkedIn</small>
      <div class="input-row">
        <i class="fa-brands fa-linkedin-in"></i>
        <input type="text" id="regLinkedin" placeholder="LinkedIn" />
      </div>

      <button id="regSaveBtn">Register</button>
    </div>

    <template id="kraftyCropTemplate">
      <div class="krafty-crop-shade">
        <section
          class="krafty-crop-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="kraftyCropTitle"
        >
          <div class="krafty-crop-eyebrow">Krafty Studio PH · Image editor</div>
          <h2 id="kraftyCropTitle" class="krafty-crop-title" data-crop-title>
            Adjust your photo
          </h2>
          <p class="krafty-crop-hint">
            Drag to reposition. Pinch, scroll, or use the slider to zoom.
          </p>
          <div class="krafty-crop-stage-shell">
            <div
              class="krafty-crop-stage"
              role="group"
              tabindex="0"
              aria-label="Image crop area. Use arrow keys to reposition."
            >
              <img alt="Image being cropped" draggable="false" />
            </div>
          </div>
          <div class="krafty-crop-caption">
            <span data-crop-caption>Image preview</span>
            <strong data-crop-ratio>RATIO</strong>
          </div>
          <div class="krafty-crop-tools">
            <label for="kraftyCropZoom"
              >Zoom <span>Pinch / scroll to adjust</span></label
            >
            <input
              id="kraftyCropZoom"
              type="range"
              min="1"
              max="4"
              step="0.01"
              value="1"
              aria-label="Image zoom level"
            />
          </div>
          <div class="krafty-crop-actions">
            <button type="button" data-action="center">Center</button>
            <button type="button" data-action="cancel">Cancel</button>
            <button
              type="button"
              class="krafty-crop-accept"
              data-action="accept"
            >
              Use photo
            </button>
          </div>
        </section>
      </div>
    </template>

    <div id="toast" class="toast"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
